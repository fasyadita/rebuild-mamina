<!DOCTYPE html>
<html>
<head>
  <title>Mamina Chatbot</title>
  <style>
    body { font-family: sans-serif; padding: 30px; max-width: 600px; margin: auto; }
    #chat-box { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; }
    .user { color: blue; margin: 5px 0; }
    .bot { color: green; margin: 5px 0; }
  </style>
</head>
<body>
  <h2>Mamina Chatbot (RAG)</h2>
  <div id="chat-box"></div>
  <input type="text" id="query" placeholder="Tulis pertanyaan..." style="width: 80%;">
  <button onclick="sendMessage()">Kirim</button>

  <script>
    function appendMessage(text, sender) {
      const div = document.createElement("div");
      div.className = sender;
      div.innerText = text;
      document.getElementById("chat-box").appendChild(div);
    }

    function sendMessage() {
      const query = document.getElementById("query").value;
      if (!query) return;

      appendMessage("Bunda: " + query, "user");

      fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: query })
      })
      .then(res => res.json())
      .then(data => {
        appendMessage("MaminaBot: " + data.response, "bot");
        document.getElementById("query").value = "";
      });
    }
  </script>
</body>
</html>
